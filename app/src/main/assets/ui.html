<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05030f">
<title>MYRAA</title>
<style>
:root{--accent:#7DF9FF;--hair1:#f8e4a6;--hair2:#d4a94c;--iris1:#7df9ff;--iris2:#6a5cff;--skin1:#fff0e6;--skin2:#f6cdb8;--bg:#05030f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(120% 80% at 50% 26%,#1b1138 0%,#0b061a 55%,#05030f 100%);touch-action:none}
.stage{position:absolute;top:0;left:0;right:0;bottom:0;perspective:1100px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.spin,.rig,.head{position:relative;transform-style:preserve-3d}
.spin{height:100%}.rig{height:100%}
.head{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:50% 41%}
.ly{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.og{transition:opacity .35s}
.spinning{animation:spin .95s cubic-bezier(.45,.05,.3,1)}
@keyframes spin{from{transform:rotateY(0deg)}to{transform:rotateY(360deg)}}
#top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 8px;display:flex;align-items:center;justify-content:space-between;z-index:5}
#brand{font-size:20px;font-weight:600;letter-spacing:.45em;color:rgba(255,255,255,.78)}
#dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:12px;background:var(--accent);vertical-align:middle;box-shadow:0 0 8px var(--accent)}
#icons button,#send,#micb,#power{background:none;border:0;color:rgba(255,255,255,.72);padding:6px;margin-left:10px;cursor:pointer}
#icons svg,#send svg,#micb svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#cap{position:absolute;left:18px;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 158px);text-align:center;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.55);text-shadow:0 1px 8px #000;z-index:4;pointer-events:none;transition:opacity .4s;max-height:3.6em;overflow:hidden}
#bar{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);display:flex;align-items:center;background:rgba(36,26,40,.82);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:4px 6px 4px 18px;z-index:5}
#inp{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font-size:17px;padding:14px 0}
#inp::placeholder{color:rgba(255,255,255,.5)}
#send{border:1px solid rgba(255,255,255,.18);border-radius:14px;margin-left:4px;padding:11px;background:rgba(255,255,255,.06)}
#micb{margin-left:2px}
#power{position:absolute;left:50%;margin-left:-36px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);width:72px;height:72px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;z-index:5;transition:box-shadow .3s,background .3s}
#power svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round}
#power.on{background:rgba(125,249,255,.16);box-shadow:0 0 28px var(--accent);border-color:var(--accent)}
#veil{display:none;position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:8}
#sheet{display:none;position:absolute;left:0;right:0;bottom:0;max-height:68%;overflow:auto;background:rgba(14,9,30,.96);border-top-left-radius:26px;border-top-right-radius:26px;border:1px solid rgba(255,255,255,.12);padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 22px);z-index:9;touch-action:pan-y}
#sheet h3{margin:0 0 12px;font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.6);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.card{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);border-radius:16px;padding:12px;color:#fff;text-align:left;font:inherit;cursor:pointer}
.card b{display:block;font-size:15px;margin-bottom:3px}.card small{color:rgba(255,255,255,.6);font-size:12px}
.card.sel{border-color:var(--accent);box-shadow:0 0 14px rgba(125,249,255,.25)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);border-radius:18px;padding:8px 14px;color:#fff;font:inherit;font-size:13px;cursor:pointer}
.chip.sel{border-color:var(--accent);background:rgba(125,249,255,.14)}
.sw{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px;vertical-align:middle}
.row{display:flex;align-items:center;justify-content:space-between;margin:10px 0;font-size:14px}
.tg{width:46px;height:26px;border-radius:13px;background:rgba(255,255,255,.18);position:relative;border:0;cursor:pointer}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.tg.on{background:var(--accent)}.tg.on::after{left:23px}
.fld{width:100%;margin:5px 0;padding:11px 13px;border-radius:12px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#fff;font:inherit;font-size:14px;outline:0}
.btn{border:0;border-radius:18px;padding:10px 18px;background:#3b4bff;color:#fff;font:inherit;font-size:14px;margin:6px 8px 6px 0;cursor:pointer}
.btn.red{background:#dc2626}.btn.grey{background:#334155}.btn.green{background:#16a34a}
.ch{display:flex;gap:14px;align-items:flex-start;border:1px solid rgba(125,249,255,.28);background:linear-gradient(135deg,rgba(125,249,255,.08),rgba(124,92,255,.10));border-radius:18px;padding:14px;margin-bottom:12px;cursor:pointer}
.ch.first{border-color:#f5c451;box-shadow:0 0 18px rgba(245,196,81,.25)}
.ch .ico{flex:0 0 46px;width:46px;height:46px}
.ch b{font-size:16px;display:block}.ch small{display:block;color:rgba(255,255,255,.64);font-size:12.5px;margin-top:4px;line-height:1.4}
.badge{display:inline-block;margin-top:6px;padding:3px 9px;border-radius:10px;font-size:10.5px;letter-spacing:.14em;font-weight:700;color:#1a1200;background:linear-gradient(90deg,#ffd66b,#f5a623)}
.join{margin-top:10px;border:0;border-radius:14px;padding:10px 18px;font:inherit;font-size:13px;font-weight:600;color:#fff;background:linear-gradient(90deg,#1da1f2,#6a5cff);cursor:pointer}
.upd{display:block;width:100%;padding:14px;border-radius:16px;border:1px solid var(--accent);background:rgba(125,249,255,.1);color:#fff;font:inherit;font-size:15px;letter-spacing:.14em;font-weight:700;cursor:pointer;margin-bottom:14px}
.msg{margin:6px 0;padding:9px 13px;border-radius:16px;font-size:14px;white-space:pre-wrap;max-width:88%;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06)}
.msg.u{margin-left:auto;background:linear-gradient(90deg,#6d5bff,#c04bff);border:0}
.note{color:rgba(255,255,255,.5);font-size:12px;margin:6px 0}
#toast{position:absolute;left:24px;right:24px;top:calc(env(safe-area-inset-top,0px) + 64px);padding:11px 16px;border-radius:14px;background:rgba(20,14,40,.94);border:1px solid rgba(255,255,255,.16);font-size:14px;text-align:center;opacity:0;pointer-events:none;transition:opacity .3s;z-index:12}
</style></head>

    var s = NATIVE ? nativeJson('getSettings', {}) : { token: ls('token', '') };
    h += '<h3>Settings</h3>';
    if (NATIVE) {
      h += '<input class="fld" id="s_model" placeholder="Model  provider:model" value="' + esc(s.model || '') + '"><input class="fld" id="s_key" type="password" placeholder="' + (s.hasKey ? 'API key (saved)' : 'API key') + '">' +
        '<input class="fld" id="s_base" placeholder="Custom base URL (optional)" value="' + esc(s.base || '') + '"><input class="fld" id="s_tav" type="password" placeholder="' + (s.hasTavily ? 'Tavily key (saved)' : 'Tavily key (optional)') + '">' +
        '<input class="fld" id="s_url" placeholder="Backend URL (empty = standalone)" value="' + esc(s.url || '') + '"><input class="fld" id="s_tok" type="password" placeholder="' + (s.hasToken ? 'Backend token (saved)' : 'Backend token') + '">' +
          '<h3>n8n Automation</h3><input class="fld" id="s_n8nUrl" placeholder="n8n Production Webhook URL" value="' + esc(s.n8nUrl || '') + '"><input class="fld" id="s_n8nToken" type="password" placeholder="' + (s.hasN8nToken ? 'n8n token saved (leave blank to keep)' : 'Optional n8n bearer token') + '">' +
        '<div class="row"><span>Voice-stop while speaking (beta)</span><button class="tg' + (s.voicestop ? ' on' : '') + '" data-tg="voicestop"></button></div>' +
        '<div class="row"><span>Auto-send messages (no confirmation)</span><button class="tg' + (s.autosend ? ' on' : '') + '" data-tg="autosend"></button></div>';
    } else {

    }
    h += '<button class="upd" data-act="updates">APP UPDATES</button>';
    h += '<div class="row"><span>Speak replies</span><button class="tg' + (st.speak ? ' on' : '') + '" data-tg="speak"></button></div><button class="btn green" data-act="save">Save</button>';
    if (NATIVE) h += '<button class="btn grey" data-act="setup">Setup permissions</button>';

}
function loadMemory() {
  function show(list) { var el = $('memlist'); if (!el) return; el.innerHTML = (list && list.length) ? list.map(function (m) { return '<div class="msg">' + esc(m) + '</div>'; }).join('') : 'Kuch yaad nahi rakha abhi.'; }
  if (NATIVE) { show(nativeJson('getMemory', [])); return; }
  if (location.protocol === 'file:') { show([]); return; }
  fetch('/api/v1/memory', { headers: authH() }).then(function (r) { return r.json(); }).then(function (j) { show(j.memories || []); }).catch(function () { show([]); });
}
function openSheet(n) { st.sheet = n; $('veil').style.display = 'block'; $('sheet').style.display = 'block'; renderSheet(); }
function closeSheet() { st.sheet = ''; $('veil').style.display = 'none'; $('sheet').style.display = 'none'; }
function readSettings() {
  var o = { voicestop: sget('voicestop'), autosend: sget('autosend'), speak: st.speak };
  ['model', 'key', 'base', 'tav', 'url', 'tok', 'n8nUrl', 'n8nToken'].forEach(function (k) { var e = $('s_' + k); if (e) o[k] = e.value; });
  return o;
}
var tmp = {};
function sget(k) { var e = document.querySelector('[data-tg="' + k + '"]'); return e ? /\bon\b/.test(e.className) : false; }
$('sheet').addEventListener('click', function (e) {
  var b = e.target; while (b && b !== $('sheet') && !(b.getAttribute && (b.getAttribute('data-join') || b.getAttribute('data-mode') || b.getAttribute('data-outfit') || b.getAttribute('data-hair') || b.getAttribute('data-act') || b.getAttribute('data-tg') || b.getAttribute('data-quick')))) b = b.parentNode;
  if (!b || b === $('sheet')) return;
  st.lastAct = Date.now();
  var v;
  if ((v = b.getAttribute('data-join'))) openChannel(v);
  else if ((v = b.getAttribute('data-mode'))) UI.setMode(v);
  else if ((v = b.getAttribute('data-outfit'))) UI.setOutfit(v, true);
  else if ((v = b.getAttribute('data-hair'))) UI.setHair(v);
  else if ((v = b.getAttribute('data-quick'))) { closeSheet(); submit(v); }
  else if ((v = b.getAttribute('data-tg'))) {
    if (v === 'auto') { st.auto = !st.auto; lset('auto', st.auto ? '1' : '0'); renderSheet(); }
    else if (v === 'speak') { st.speak = !st.speak; lset('speak', st.speak ? '1' : '0'); if (!st.speak) stopSpeech(); if (NATIVE) { try { window.MyraaBridge.saveSettings(JSON.stringify({ speak: st.speak })); } catch (x) { } } renderSheet(); }
    else { b.className = /\bon\b/.test(b.className) ? 'tg' : 'tg on'; }
  } else if ((v = b.getAttribute('data-act'))) {
    if (v === 'updates') openChannel(Core.UPDATES_SLUG);
                              else if (v === 'openN8nSettings') openSheet('settings');
                              else if (v === 'runN8n') {
                                if (!NATIVE || !window.MyraaBridge || !window.MyraaBridge.triggerN8n) {
                                  toast('n8n trigger Android app mein available hai'); return;
                                }
                                var ev = $('n8n_event'), pd = $('n8n_payload'), data;
                                try { data = JSON.parse(pd ? pd.value : '{}'); }
                                catch (err) { toast('Payload valid JSON hona chahiye'); return; }
                                var payload = { event: (ev && ev.value || 'manual').trim() || 'manual',
                                  data: data, source: 'MYRAA', timestamp: new Date().toISOString() };
                                var out = $('n8n_result'); if (out) out.textContent = 'Workflow request bhej rahe hain...';
                                try { window.MyraaBridge.triggerN8n(JSON.stringify(payload)); }
                                catch (err) { if (out) out.textContent = 'Trigger start nahi hua.'; toast('n8n trigger fail'); }
                              }
    else if (v === 'nextOutfit') UI.nextOutfit();
    else if (v === 'stopAll') stopAll();
    else if (v === 'attach') { try { window.MyraaBridge.attach(); } catch (x) { } }
    else if (v === 'setup') { try { window.MyraaBridge.setup(); } catch (x) { } }
    else if (v === 'clearMem') { if (NATIVE) { try { window.MyraaBridge.clearMemory(); } catch (x) { } renderSheet(); } else { fetch('/api/v1/memory/clear', { method: 'POST', headers: authH(), body: '{}' }).then(renderSheet).catch(function () { }); } }
    else if (v === 'save') {

      else { lset('token', s.tok || ''); toast('Token save ho gaya'); }

});
$('veil').addEventListener('click', closeSheet);
[].forEach.call(document.querySelectorAll('#icons button'), function (b) { b.addEventListener('click', function () { var n = b.getAttribute('data-sheet'); if (st.sheet === n) closeSheet(); else openSheet(n); }); });

/* ---- speech (browser) + stop */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition, rec = null;
function speakBrowser(text) {
  if (!st.speak || !window.speechSynthesis) return;
  try { speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(String(text).slice(0, 300)); u.lang = 'en-IN'; u.onstart = function () { Avatar.setState('speaking'); }; u.onend = function () { Avatar.setState('idle'); }; speechSynthesis.speak(u); } catch (e) { }
}
function stopSpeech() { try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) { } }
function stopAll() {            // interrupt: speech, in-flight request, stale reply is ignored via request id
  st.req++; stopSpeech(); if (st.ctl) { try { st.ctl.abort(); } catch (e) { } st.ctl = null; }
  if (NATIVE) { try { window.MyraaBridge.stop(); } catch (e) { } }
  Avatar.setState('idle'); caption('Ruk gayi.', false);
}
UI.stopAll = stopAll;
function authH() { var h = { 'Content-Type': 'application/json' }, t = ls('token', ''); if (t) h.Authorization = 'Bearer ' + t; return h; }

/* ---- sending */
function applyUi(cmd) {
  if (!cmd) return false;
  if (cmd.type === 'mode') { UI.setMode(cmd.mode); return true; }
  if (cmd.type === 'outfit') { if (cmd.name) UI.setOutfit(cmd.name, true); else UI.nextOutfit(); return true; }
  if (cmd.type === 'hair') { UI.setHair(cmd.color); return true; }
  if (cmd.type === 'auto') { st.auto = cmd.on; lset('auto', cmd.on ? '1' : '0'); caption('Auto dress ' + (cmd.on ? 'on' : 'off'), false); return true; }
  return false;
}
function submit(text) {
  text = String(text || '').trim(); if (!text) return;
  st.lastAct = Date.now();
  if (/^(stop|ruko|bas|chup ho jao|cancel|interrupt)$/i.test(text)) { stopAll(); return; }
  var cmd = Core.parseUiCommand(text);
  if (cmd) { addHist('Aap', text); applyUi(cmd); return; }
  addHist('Aap', text); st.last = 'Aap|' + text; Avatar.setState('thinking'); caption('...', true);
  var id = ++st.req;
  if (NATIVE) { try { window.MyraaBridge.send(text); } catch (e) { toast('Bridge error'); Avatar.setState('error'); } return; }
  if (location.protocol === 'file:') {
    setTimeout(function () { if (id === st.req) UI.onLine('MYRAA', 'Preview mode hai. Server ya app se connect karoge to main asli jawab dungi.'); }, 500); return;
  }
  var ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null; st.ctl = ctl;
  fetch('/api/v1/chat', { method: 'POST', headers: authH(), body: JSON.stringify({ text: text, mode: st.mode }), signal: ctl ? ctl.signal : undefined })
    .then(function (r) { return r.json().then(function (j) { return { s: r.status, j: j }; }); })
    .then(function (o) {
      if (id !== st.req) return;        // interrupted or superseded: never act on a stale answer
      UI.onLine('MYRAA', o.s === 401 ? 'Token galat hai. Settings mein daalo.' : (o.j.reply || o.j.error || 'Koi jawab nahi mila.'));
    })
    .catch(function (e) { if (id !== st.req) return; Avatar.setState('error'); UI.onLine('MYRAA', 'Server se connect nahi hua.'); setTimeout(function () { Avatar.setState('idle'); }, 1500); });
}
UI.submit = submit;
function sendFromInput() { var i = $('inp'); var v = i.value; i.value = ''; if (NATIVE) addLocal(v); submit(v); }
function addLocal() { }
$('send').addEventListener('click', sendFromInput);
$('inp').addEventListener('keydown', function (e) { if (e.key === 'Enter') sendFromInput(); });
$('inp').addEventListener('focus', function () { st.lastAct = Date.now(); });
$('micb').addEventListener('click', function () {
  st.lastAct = Date.now(); stopSpeech();
  if (NATIVE) { try { window.MyraaBridge.mic(); } catch (e) { toast('Mic error'); } return; }
  if (!SR) { toast('Is browser mein mic support nahi hai'); return; }
  try { var r = new SR(); r.lang = 'hi-IN'; r.onstart = function () { Avatar.setState('listening'); }; r.onresult = function (e) { submit(e.results[0][0].transcript); }; r.onerror = function () { Avatar.setState('idle'); }; r.onend = function () { if (!st.wake) Avatar.setState('idle'); }; r.start(); } catch (e) { toast('Mic start nahi hua'); }
});
$('power').addEventListener('click', function () {
  st.lastAct = Date.now();
  if (NATIVE) { try { window.MyraaBridge.toggleWake(); } catch (e) { toast('Wake error'); } return; }
  if (!SR) { toast('Is browser mein hands-free support nahi hai'); return; }
  if (st.wake) { st.wake = false; try { rec.stop(); } catch (e) { } UI.onWake(false); Avatar.setState('idle'); return; }
  UI.onWake(true); startRec();
});
function startRec() {
  try {
    rec = new SR(); rec.lang = 'hi-IN'; rec.continuous = true; rec.interimResults = false;
    rec.onresult = function (e) { handleSpoken(e.results[e.results.length - 1][0].transcript); };
    rec.onend = function () { if (st.wake) setTimeout(startRec, 300); };
    rec.onerror = function () { };
    rec.start();
  } catch (e) { }
}
function handleSpoken(t) {
  t = String(t || '').trim();
  if (/^(stop|ruko|bas|chup|cancel)\b/i.test(t)) { stopAll(); return; }
  var m = t.match(/\b(?:hey|hay|ok)?\s*(?:myr+a+|meer+a+|mir+a+|mair+a+)\b[,\s]*(.*)$/i);
  if (m) { var rest = (m[1] || '').trim(); if (/^(stop|ruko|bas|chup)/i.test(rest)) stopAll(); else if (rest.length > 2) submit(rest); else { Avatar.setState('listening'); caption('Ji?', false); } }
}
UI.handleSpoken = handleSpoken;
UI.back = function () { if (st.sheet) { closeSheet(); return true; } return false; };

/* ---- boot */
function boot() {
  Avatar.init();
  var s = NATIVE ? nativeJson('getSettings', {}) : {};
  if (NATIVE && s.mode && Core.MODES[s.mode]) st.mode = s.mode;
  if (NATIVE && typeof s.speak === 'boolean') st.speak = s.speak;
  if (NATIVE) { var h = nativeJson('getHistory', []); if (h && h.length) { UI.loadHistory(h); } try { UI.onWake(window.MyraaBridge.wakeOn()); } catch (e) { } }
  Avatar.setMode(st.mode); Avatar.setHair(st.hair);
  if (!Core.OUTFITS[st.outfit] || Core.MODES[st.mode].outfits.indexOf(st.outfit) < 0) st.outfit = Core.pickOutfit(st.mode, new Date().getHours(), Math.random, '');
  Avatar.paintOutfit(st.outfit); syncNativeMode();
  Avatar.setState('idle'); caption(HINT, true);
}
UI._state = st;
window.MyraaN8nResult = function (raw) {
    var result;
    try { result = JSON.parse(raw); } catch (e) { result = { ok: false, error: 'Invalid response' }; }
    var el = $('n8n_result');
    var msg = result.ok ? ('Workflow response received (HTTP ' + result.status + ').') :
      ('Workflow failed: ' + (result.error || ('HTTP ' + (result.status || 'error'))));
    if (el) el.textContent = msg;
    toast(msg);
  };
  UI.openSheet = openSheet;
boot();
})();
