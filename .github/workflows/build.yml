name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MYRAA Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Test Python backend
      - name: Backend self-test
        run: python myraa.py test

      # 4. Setup Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 5. Setup Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 6. Install Android SDK packages
      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses

      # 7. Setup Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # 8. Build debug APK
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      # 9. Verify APK exists
      - name: Verify APK
        run: |
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "ERROR: Debug APK was not generated."
            exit 1
          fi
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      # 10. Upload APK artifact
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: myraa-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      # 11. Generate Gradle wrapper files
      - name: Generate Gradle wrapper
        if: success()
        continue-on-error: true
        run: gradle wrapper --gradle-version 8.7

      # 12. Upload Gradle wrapper files
      - name: Upload Gradle wrapper files
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-files
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: warn
          retention-days: 7
